{% for field in form %}
  <div class="form-field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required"> (required)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}
      <div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
